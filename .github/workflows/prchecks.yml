on:
  pull_request:
    branches:
      - main

name: Binary checks

jobs:

  build:
    name: Build for ${{ matrix.config.os }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release', artifact_name: '*.tar.gz', asset_name: macOS}
          - {os: windows-latest, r: 'release', artifact_name: '*.zip', asset_name: winOS}
          - {os: ubuntu-latest, r: 'release', artifact_name: '*.tar.gz', asset_name: linuxOS}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          needs: check, build
          extra-packages: |
            any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
          # Make the functional audits fail rather than skip, so a broken layout
          # or plot method cannot pass CI green. Locally the audits still skip
          # with a greppable "AUDIT [...]" message (see helper-functional.R).
          AUTOGRAPH_STRICT_AUDIT: true
        with:
          upload-snapshots: true

      - name: Binary
        run: |
          pkgbuild::clean_dll()
          binary <- pkgbuild::build(binary = TRUE, needs_compilation = TRUE, compile_attributes = TRUE)
          dir.create("build")
          file.copy(binary, "build")
        shell: Rscript {0}

      - name: Save binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.asset_name }}
          path: build/

      - name: Calculate code coverage
        if: runner.os == 'macOS'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          # Without this, every skip_on_cran() test is skipped while coverage is
          # measured -- which is most of the suite, including all the functional
          # audits -- and the reported figure badly under-reads.
          NOT_CRAN: true
        run: Rscript -e 'covr::codecov(token = Sys.getenv("CODECOV_TOKEN"))'

      - name: Lint
        if: runner.os == 'macOS'
        run: lintr::lint_package()
        shell: Rscript {0}

      - name: Spell check
        if: runner.os == 'macOS'
        run: spelling::spell_check_package()
        shell: Rscript {0}

  website-builds:
    name: Website builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # rsconnect is not a package dependency, but pkgdown::build_site()
          # calls build_tutorials() for inst/tutorials/, and that step reads
          # rsconnect deployment records. Without it the site build errors out
          # and the website is never checked. pushrelease.yml installs it too.
          extra-packages: |
            any::pkgdown
            any::rsconnect
            local::.
          needs: website

      # The site itself is deployed from pushrelease.yml, but a missing index
      # entry or a broken cross-reference only surfaces at build time, which is
      # too late. check_pkgdown() catches a topic left out of the reference
      # index; the build catches everything else, and its output is discarded.
      - name: Check reference index covers every topic
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site(preview = FALSE, install = FALSE, new_process = FALSE)
        shell: Rscript {0}

  articles-in-sync:
    name: Tutorial articles are in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - name: Regenerate tutorial articles
        run: Rscript data-raw/build_tutorial_articles.R

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- vignettes/articles/; then
            echo "::error::vignettes/articles/*.Rmd are out of date with inst/tutorials/*.Rmd. Run 'Rscript data-raw/build_tutorial_articles.R' and commit the result."
            exit 1
          fi

  pr-metadata:
    name: PR metadata checks
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DESCRIPTION version is bumped
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_VERSION=$(git show "$BASE_SHA:DESCRIPTION" | grep -m1 '^Version:' | sed 's/Version: *//')
          HEAD_VERSION=$(grep -m1 '^Version:' DESCRIPTION | sed 's/Version: *//')
          echo "Base version: $BASE_VERSION"
          echo "Head version: $HEAD_VERSION"
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::DESCRIPTION Version has not been bumped from $BASE_VERSION"
            exit 1
          fi
          HIGHEST=$(printf '%s\n%s\n' "$BASE_VERSION" "$HEAD_VERSION" | sort -V | tail -n1)
          if [ "$HIGHEST" != "$HEAD_VERSION" ]; then
            echo "::error::DESCRIPTION Version $HEAD_VERSION is not greater than base version $BASE_VERSION"
            exit 1
          fi

      - name: Check PR title mentions the new version number
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          HEAD_VERSION=$(grep -m1 '^Version:' DESCRIPTION | sed 's/Version: *//')
          if [[ "$PR_TITLE" != *"$HEAD_VERSION"* ]]; then
            echo "::error::PR title does not mention the new version number ($HEAD_VERSION): \"$PR_TITLE\""
            exit 1
          fi

      - name: Check PR description itemizes changes under subsection titles
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qE '^##[[:space:]]' <<< "$PR_BODY"; then
            echo "::error::PR description does not itemize changes under subsection titles (e.g. \"## Data\")"
            exit 1
          fi
