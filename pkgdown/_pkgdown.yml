url: https://stocnet.github.io/autograph/
development:
    mode: auto
template:
  bootstrap: 5
  bootswatch: superhero
authors:
  James Hollway:
    href: https://jameshollway.com
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - tutorials
    - family
    - news
    right:
    - search
    - github
    - cran
  components:
    home:
      icon: fa-home fa-lg
      href: index.html
      aria-label: Go to home
    reference:
      text: Function Overview
      href: reference/index.html
    tutorials:
      text: Tutorials
      menu:
      - text: Visualising Networks
        href: articles/visualising-networks.html
    family:
      text: Related Packages
      menu:
      - text: manynet
        href: https://stocnet.github.io/manynet/
      - text: netrics
        href: https://stocnet.github.io/netrics/
      - text: migraph
        href: https://stocnet.github.io/migraph/
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      href: https://github.com/stocnet/autograph
      aria-label: View on Github
    cran:
      icon: "fab fa-r-project"
      href: https://cloud.r-project.org/package=autograph
      aria-label: View on CRAN

articles:
  - title: Tutorials
    desc: |
      Static, read-only versions of the interactive `learnr` tutorials
      bundled with the package. Install the package and run `run_tute()`
      for the full interactive experience.
    contents:
      - "`articles/visualising-networks`"
reference:
  - title: "Theming"
    desc: |
      Functions for tailoring graphs with themes, scales, and palettes.
    contents:
      - theme_set
      - ag_call
      - list_fonts
      - theme_colorblind
      - match_color
      - ends_with("themes")
      - ends_with("scales")
      - ends_with("palettes")
  - title: "Graphing"
    desc: |
      Functions for graphing networks.
      `graphr()` graphs any manynet-compatible class object automagically.
      `graphs()` and `grapht()` do the same for multiple networks
      and dynamic networks, respectively.
    contents:
      - graphr
      - graphs
      - grapht
  - title: "Plotting"
    desc: |
      `plot()` methods exist for results and other objects for stocnet packages.
    contents:
      - starts_with("plot.")
      - count_pages
  - title: "Layouts"
    desc: |
      Functions for laying out the nodes in a graph.
      Included here are some improved or additional layouts to those offered
      in `{igraph}` and `{ggraph}` by default.
    contents:
      - starts_with("layout")
  - title: "Results objects from other packages"
    contents:
      - made_earlier
  
